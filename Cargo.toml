# Remote Robotics Developer Cockpit — Cargo workspace
# See PROJECT_CONTEXT.md and docs/specs/ARCHITECTURE.md

[workspace]
resolver = "2"
members = [
    "protocol",
    "server",
    "desktop",
    "tools/phone-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

# Centralized dependency versions. Crates opt in via `foo.workspace = true`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
portable-pty = "0.8"
